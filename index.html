<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Tech CSE (AI) - Syllabus Portal</title>
    <style>
        :root {
            --bg-dark: #0f0c1b;
            --card-bg: #1a162b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2846;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
        }

        .sync-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .subject-card:hover, .subject-card.active {
            border-color: var(--accent);
            background: #231d3a;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
        }

        .subject-card h3 {
            font-size: 0.95rem;
        }

        .content-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
        }

        .tab-btn.active {
            color: var(--accent);
            background: rgba(139, 92, 246, 0.15);
        }

        .unit-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .unit-card h4 {
            color: var(--accent);
            margin-bottom: 8px;
            font-size: 1.05rem;
            outline: none;
        }

        .unit-card p {
            color: var(--text-main);
            font-size: 0.9rem;
            line-height: 1.6;
            outline: none;
        }

        .editable-active {
            border: 1px dashed var(--accent) !important;
            padding: 6px;
            border-radius: 4px;
            background: rgba(139, 92, 246, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>B.Tech CSE (AI) - Syllabus Portal</h1>
        <p>Global Real-Time Academic Portal</p>
    </header>

    <div class="controls-bar">
        <button class="btn" id="edit-toggle-btn" onclick="toggleEditMode()">✏️ Edit Mode: OFF</button>
        <span class="sync-badge" id="sync-status">🟢 Syncing...</span>
    </div>

    <div class="subject-grid">
        <div class="subject-card active" onclick="selectSubject('physics', this)">
            <h3>Applied Physics</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('maths', this)">
            <h3>Mathematics-I</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('electrical', this)">
            <h3>Basic Electrical</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('english', this)">
            <h3>English</h3>
        </div>
    </div>

    <div class="content-panel">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('syllabus', this)">📚 Detailed Syllabus</button>
            <button class="tab-btn" onclick="switchTab('topics', this)">⭐ Key Topics</button>
        </div>

        <div id="content-container"></div>

        <div class="admin-controls" id="admin-controls" style="display: none; margin-top: 15px;">
            <button class="btn btn-primary" onclick="addNewItem()">+ Add New Unit / Topic</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBDr7LzpZGwGSP6KAl5gqdK1-sBavjdYhc",
      authDomain: "syllabus-b899e.firebaseapp.com",
      databaseURL: "https://syllabus-b899e-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "syllabus-b899e",
      storageBucket: "syllabus-b899e.firebasestorage.app",
      messagingSenderId: "105180350358",
      appId: "1:105180350358:web:31fb7c5c41ddb410273fb7",
      measurementId: "G-DYYW1SH4XB"
    };

    const defaultData = {
        physics: {
            syllabus: [
                { title: "Unit 1: Mechanics (09 Hours)", details: "Newton's Laws, Potential energy function, F = - Grad V, Conservative and non-conservative forces, Harmonic oscillator, Damped harmonic motion, Forced oscillations and resonance." },
                { title: "Unit 2: Electromagnetic Theory (09 Hours)", details: "Electric field, Bound charges, Electric displacement, Ampere's Law, Continuity equation, Maxwell's equations, Wave equation in vacuum." },
                { title: "Unit 3: Quantum Mechanics (09 Hours)", details: "Wave nature of Particles, Schrodinger equation, Born interpretation, Expectation values, Uncertainty principle, Particle in a 1D box." },
                { title: "Unit 4: Wave Optics (09 Hours)", details: "Huygens' Principle, Superposition of waves, Interference, Newton's rings, Single slit diffraction, Diffraction gratings." },
                { title: "Unit 5: Lasers (09 Hours)", details: "Einstein's A and B coefficients, Population inversion, He-Ne laser, Ruby laser, Laser applications." }
            ],
            topics: [{ title: "High Yield Topics", details: "Schrodinger 1D Box, Maxwell Equations, Newton's Rings, He-Ne Laser." }]
        },
        maths: {
            syllabus: [
                { title: "Unit I: Calculus-I (10 Hours)", details: "Evolutes and involutes, Beta and Gamma functions, Surface areas and volumes." },
                { title: "Unit II: Calculus-II (10 Hours)", details: "Rolle's Theorem, Mean value theorems, Taylor's & Maclaurin theorems, L'Hospital's rule." },
                { title: "Unit III: Sequences and Series (10 Hours)", details: "Convergence tests, Power series, Fourier series." },
                { title: "Unit IV: Multivariable Calculus (10 Hours)", details: "Partial derivatives, Total derivative, Maxima & minima, Lagrange multipliers." },
                { title: "Unit V: Matrices (08 Hours)", details: "Rank of matrix, Linear equations, Eigenvalues & Eigenvectors, Cayley-Hamilton Theorem." }
            ],
            topics: [{ title: "High Yield Topics", details: "Cayley-Hamilton Theorem, Eigenvalues, Beta/Gamma Integrals, Fourier Series." }]
        },
        electrical: {
            syllabus: [
                { title: "Unit 1: DC Circuits (09 Hours)", details: "R, L, C elements, KVL & KCL, Superposition, Thevenin & Norton Theorems." },
                { title: "Unit 2: AC Circuits (09 Hours)", details: "Sinusoidal waveforms, RMS values, Phasor representation, Real & Reactive power, Resonance." },
                { title: "Unit 3: Transformers (09 Hours)", details: "Single-phase transformers, Losses, Efficiency, Voltage regulation." },
                { title: "Unit 4: Electrical Machines (09 Hours)", details: "Induction motor working, Torque-slip characteristic, DC motor starters." },
                { title: "Unit 5: Power Source (09 Hours)", details: "Solar, Wind, Hydroelectric, Thermal power plants, Battery types." }
            ],
            topics: [{ title: "High Yield Topics", details: "Thevenin/Norton Problems, Transformer Efficiency, Star-Delta, KVL/KCL." }]
        },
        english: {
            syllabus: [
                { title: "Unit 1: Vocabulary Building (06 Hours)", details: "Word formation, Prefixes & Suffixes, Synonyms & Antonyms." },
                { title: "Unit 2: Basic Writing Skills (06 Hours)", details: "Sentence structures, Paragraph coherence, Précis writing." },
                { title: "Unit 3: Common Errors (06 Hours)", details: "Subject-verb agreement, Articles, Prepositions, Modifiers." },
                { title: "Unit 4: Sensible Writing (06 Hours)", details: "Describing, Defining, Classifying, Writing conclusion." },
                { title: "Unit 5: Communication Practices (06 Hours)", details: "Comprehension, Essay writing, Workplace dialogues, Presentations." }
            ],
            topics: [{ title: "High Yield Topics", details: "Précis Writing, Subject-Verb Agreement, Official Letters, Correcting Errors." }]
        }
    };

    let appData = {};
    let currentSubject = 'physics';
    let currentTab = 'syllabus';
    let isEditMode = false;
    let database = null;
    let dbRef = null;

    try {
        const app = initializeApp(firebaseConfig);
        database = getDatabase(app);
        dbRef = ref(database, 'syllabusData');

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appData = data;
                document.getElementById('sync-status').innerText = '🟢 Cloud Synced';
            } else {
                appData = defaultData;
                saveToFirebase();
            }
            renderContent();
        }, (error) => {
            console.warn("Sync Error:", error);
            document.getElementById('sync-status').innerText = '🔴 Sync Failed';
        });
    } catch (e) {
        console.error("Init Error:", e);
    }

    function saveToFirebase() {
        if (dbRef && appData) {
            document.getElementById('sync-status').innerText = '⏳ Saving...';
            set(dbRef, appData)
                .then(() => {
                    document.getElementById('sync-status').innerText = '🟢 Saved to Cloud';
                })
                .catch((err) => {
                    console.error("Save error:", err);
                    document.getElementById('sync-status').innerText = '🔴 Save Failed';
                });
        }
    }

    window.renderContent = function() {
        const container = document.getElementById('content-container');
        if (!appData || !appData[currentSubject]) return;

        const items = (appData[currentSubject] && appData[currentSubject][currentTab]) ? appData[currentSubject][currentTab] : [];
        let html = '';

        items.forEach((item, index) => {
            html += `
                <div class="unit-card">
                    <h4 contenteditable="${isEditMode}" class="${isEditMode ? 'editable-active' : ''}" onblur="window.updateData(${index}, 'title', this.innerText)">${item.title}</h4>
                    <p contenteditable="${isEditMode}" class="${isEditMode ? 'editable-active' : ''}" onblur="window.updateData(${index}, 'details', this.innerText)">${item.details}</p>
                    ${isEditMode ? `<button class="btn btn-danger" style="margin-top: 10px; padding: 4px 10px; font-size: 0.8rem;" onclick="window.deleteItem(${index})">🗑️ Delete Item</button>` : ''}
                </div>
            `;
        });

        if (items.length === 0) {
            html = '<p style="color: var(--text-muted);">No content available. Switch ON Edit Mode to add content.</p>';
        }

        container.innerHTML = html;
    };

    window.selectSubject = function(subject, element) {
        currentSubject = subject;
        document.querySelectorAll('.subject-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        renderContent();
    };

    window.switchTab = function(tab, element) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        renderContent();
    };

    window.toggleEditMode = function() {
        isEditMode = !isEditMode;
        const btn = document.getElementById('edit-toggle-btn');
        const adminControls = document.getElementById('admin-controls');

        if (isEditMode) {
            btn.innerText = '✏️ Edit Mode: ON';
            btn.classList.add('btn-active');
            adminControls.style.display = 'block';
        } else {
            btn.innerText = '✏️ Edit Mode: OFF';
            btn.classList.remove('btn-active');
            adminControls.style.display = 'none';
        }
        renderContent();
    };

    window.updateData = function(index, key, val) {
        if (appData && appData[currentSubject] && appData[currentSubject][currentTab][index]) {
            appData[currentSubject][currentTab][index][key] = val;
            saveToFirebase();
        }
    };

    window.addNewItem = function() {
        if (!appData[currentSubject]) appData[currentSubject] = {};
        if (!appData[currentSubject][currentTab]) appData[currentSubject][currentTab] = [];
        
        appData[currentSubject][currentTab].push({
            title: "New Unit / Topic Title (Click to Edit)",
            details: "Type syllabus content or topic details here..."
        });
        saveToFirebase();
        renderContent();
    };

    window.deleteItem = function(index) {
        if (confirm("Kya aap ise delete karna chahte hain?")) {
            appData[currentSubject][currentTab].splice(index, 1);
            saveToFirebase();
            renderContent();
        }
    };
</script>
</body>
</html>
