    <style>
        :root {
            --bg-dark: #0f0c1b;
            --card-bg: #1a162b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2846;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .subject-card:hover, .subject-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
        }

        .subject-card h3 {
            font-size: 1rem;
        }

        .content-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
        }

        .unit-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .unit-card h4 {
            color: var(--accent);
            margin-bottom: 8px;
        }

        .unit-card p {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>

<div class="container">

        </div>

        </div>
    </div>

    <div class="content-panel">
        <div class="tab-buttons">

        <div id="content-container">

            <button class="btn btn-primary" onclick="addNewItem()">+ Add New Topic/Unit</button>
        </div>
    </div>
</div>

### 1. Applied Physics (BTCSEAI 101)
* **Unit 1: Mechanics** - Newton's Laws, Potential energy function ($F = -\text{Grad } V$), Conservative and non-conservative forces, Harmonic oscillator, Damped harmonic motion (over, critically, lightly damped), Forced oscillations, and resonance.
* **Unit 2: Electromagnetic Theory** - Electric field calculation, Bound charges (electric polarization), Electric displacement, Ampere's Law and its inconsistency, Continuity equation, Maxwell's equations (differential and integral forms), Wave equation in vacuum and non-conducting medium.
* **Unit 3: Quantum Mechanics** - Wave nature of particles, Time-dependent and time-independent Schrodinger equation, Born interpretation, Expectation values, Wave-packets, Uncertainty principle, Particle in a 1D box, Tunneling effect.
* **Unit 4: Wave Optics** - Huygens' Principle, Interference (wave front splitting & amplitude splitting), Young's double slit experiment, Newton's rings, Fraunhofer diffraction (single slit), Diffraction gratings, Resolving power.
* **Unit 5: Lasers** - Einstein's A and B coefficients, Population inversion, Gas lasers (He-Ne), Solid-state lasers (Ruby), Laser beam properties (monochromaticity, coherence, directionality, brightness), Applications.

---

### 2. Mathematics-I (BTCSEAI-102)
* **Unit 1: Calculus-I** - Evolutes and involutes, Definite and improper integrals, Beta and Gamma functions, Surface areas and volumes of revolutions.
* **Unit 2: Calculus-II** - Rolle's Theorem, Mean value theorems, Taylor's and Maclaurin theorems with remainders, Indeterminate forms, L'Hospital's rule, Maxima and minima.
* **Unit 3: Sequences and Series** - Convergence tests, Power series, Taylor's/Fourier series, Half range sine/cosine series, Parseval's theorem.
* **Unit 4: Multivariable Calculus** - Partial derivatives, Directional derivatives, Tangent plane and normal line, Saddle points, Lagrange multipliers, Gradient, curl, and divergence.
* **Unit 5: Matrices** - Inverse and rank of a matrix, Rank-nullity theorem, System of linear equations, Eigenvalues and eigenvectors, Diagonalization, Cayley-Hamilton Theorem.

---

### 3. Basic Electrical Engineering
* **Unit 1: DC Circuits** - Circuit elements (R, L, C), Independent voltage/current sources, Series/parallel circuits, KVL and KCL, Superposition, Thevenin, and Norton Theorems.
* **Unit 2: AC Circuits** - Sinusoidal waveforms, Average and RMS values, Form/peak factor, Phasor representation, R-L-C series/parallel circuits, Resonance, 3-phase balanced circuits (star/delta).
* **Unit 3: Transformers** - Principle and construction of single-phase transformers (core and shell), Losses, Efficiency, Voltage regulation, Self/mutual inductance, BH characteristics.
* **Unit 4: Electrical Machines** - Rotating magnetic fields, Single/three-phase induction motor, Torque-slip characteristics, DC motors (types, characteristics, necessity of starter).
* **Unit 5: Power Source** - Wind, Solar, Fuel cell, Hydroelectric, Thermal, Nuclear power plants, Battery types and characteristics.

---

### 4. English / Communication Skills
* **Unit 1: Vocabulary Building** - Word formation, Foreign root words, Prefixes and suffixes, Synonyms, antonyms, Abbreviations.
* **Unit 2: Basic Writing Skills** - Sentence structures, Phrases and clauses, Punctuation, Paragraph principles, Précis writing.
* **Unit 3: Identifying Common Errors in Writing** - Subject-verb agreement, Noun-pronoun agreement, Articles, Prepositions, Redundancies.
* **Unit 4: Nature and Style of Sensible Writing** - Describing, defining, classifying, Writing introduction and conclusion.
* **Unit 5: Writing Practices and Oral Communication** - Comprehension, Précis writing, Essay writing, Listening comprehension, Conversations, Workplace communication, Presentations.
