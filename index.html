<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Tech CSE (AI) - Syllabus Portal</title>
    <style>
        :root {
            --bg-dark: #0f0c1b;
            --card-bg: #1a162b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2846;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
        }

        .sync-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .subject-card:hover, .subject-card.active {
            border-color: var(--accent);
            background: #231d3a;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
        }

        .subject-card h3 {
            font-size: 0.95rem;
        }

        .content-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--accent);
            background: rgba(139, 92, 246, 0.15);
        }

        .unit-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .unit-card h4 {
            color: var(--accent);
            margin-bottom: 8px;
            font-size: 1.05rem;
            outline: none;
        }

        .unit-card p {
            color: var(--text-main);
            font-size: 0.9rem;
            line-height: 1.6;
            outline: none;
        }

        .editable-active {
            border: 1px dashed var(--accent) !important;
            padding: 4px;
            border-radius: 4px;
            background: rgba(139, 92, 246, 0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>B.Tech CSE (AI) - Syllabus Portal</h1>
        <p>Real-time Collaborative Academic Portal</p>
    </header>

    <div class="controls-bar">
        <button class="btn" id="edit-toggle-btn" onclick="toggleEditMode()">✏️ Edit Mode: OFF</button>
        <span class="sync-badge" id="sync-status">🟢 Ready</span>
    </div>

    <div class="subject-grid">
        <div class="subject-card active" onclick="selectSubject('physics', this)">
            <h3>Applied Physics</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('maths', this)">
            <h3>Mathematics-I</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('electrical', this)">
            <h3>Basic Electrical</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('english', this)">
            <h3>English</h3>
        </div>
    </div>

    <div class="content-panel">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('syllabus', this)">📚 Detailed Syllabus</button>
            <button class="tab-btn" onclick="switchTab('topics', this)">⭐ Key Topics</button>
        </div>

        <div id="content-container"></div>

        <div class="admin-controls" id="admin-controls" style="display: none; margin-top: 15px;">
            <button class="btn btn-primary" onclick="addNewItem()">+ Add New Unit / Topic</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://syllabus-sessional-1-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const defaultData = {
        physics: {
            syllabus: [
                { title: "Unit 1: Mechanics (09 Hours)", details: "Newton's Laws, Potential energy function, F = - Grad V, Conservative and non-conservative forces, Harmonic oscillator, Damped harmonic motion (over-damped, critically damped, lightly-damped), Forced oscillations and resonance." },
                { title: "Unit 2: Electromagnetic Theory (09 Hours)", details: "Calculation of electric field for charge distribution, Bound charges due to electric polarization, Electric displacement, Ampere's Law, Inconsistency in Ampere's law, Continuity equation, Maxwell's equations (differential and integral form), Wave equation in vacuum and non-conducting medium." },
                { title: "Unit 3: Quantum Mechanics (09 Hours)", details: "Introduction to Quantum mechanics, Wave nature of Particles, Time-dependent and time independent Schrodinger equation, Born interpretation, Expectation values, Wave-packets, Uncertainty principle, Particle in a 1D box, Tunneling effect." },
                { title: "Unit 4: Wave Optics (09 Hours)", details: "Huygens' Principle, Superposition of waves & interference (wave front & amplitude splitting), Young's double slit experiment, Newton's rings, Fraunhofer diffraction (single slit), Diffraction gratings and resolving power." },
                { title: "Unit 5: Lasers (09 Hours)", details: "Einstein's A and B coefficients, Amplification of light by population inversion, Gas lasers (He-Ne), Solid-state lasers (Ruby), Laser properties (monochromaticity, coherence, directionality, brightness), Applications." }
            ],
            topics: [
                { title: "High Yield Exam Topics", details: "1D Schrodinger Box Problem, Maxwell's Equations Derivation, Newton's Rings Numericals, He-Ne Laser Working, Damped & Forced Oscillations." }
            ]
        },
        maths: {
            syllabus: [
                { title: "Unit I: Calculus-I (10 Hours)", details: "Evolutes and involutes, Evaluation of definite and improper integrals, Beta and Gamma functions and properties, Applications of definite integrals (surface areas and volumes of revolutions)." },
                { title: "Unit II: Calculus-II (10 Hours)", details: "Rolle's Theorem, Mean value theorems, Taylor's and Maclaurin theorems with remainders, Indeterminate forms, L'Hospital's rule, Maxima and minima." },
                { title: "Unit III: Sequences and Series (10 Hours)", details: "Convergence of sequence and series, Tests for convergence, Power series, Taylor's series, Trigonometric/logarithm series, Fourier series (Half range sine/cosine series, Parseval's theorem)." },
                { title: "Unit IV: Multivariable Calculus (10 Hours)", details: "Limit, continuity, partial derivatives, Directional derivatives, Total derivative, Tangent plane and normal line, Maxima, minima & saddle points, Lagrange multipliers, Gradient, curl, and divergence." },
                { title: "Unit V: Matrices (08 Hours)", details: "Inverse and rank of a matrix, Rank-nullity theorem, System of linear equations, Symmetric, skew-symmetric and orthogonal matrices, Eigenvalues & eigenvectors, Diagonalization, Cayley-Hamilton Theorem." }
            ],
            topics: [
                { title: "High Yield Exam Topics", details: "Cayley-Hamilton Theorem, Eigenvalues & Eigenvectors, Beta & Gamma Function Integrals, Fourier Series Expansion, Lagrange Multipliers." }
            ]
        },
        electrical: {
            syllabus: [
                { title: "Unit 1: DC Circuits (09 Hours)", details: "Electrical circuit elements (R, L, C), Voltage and current sources, Series & parallel circuits, KVL and KCL, Power and energy, Superposition, Thevenin and Norton Theorems." },
                { title: "Unit 2: AC Circuits (09 Hours)", details: "Sinusoidal waveforms, RMS and average values, Form factor, Peak factor, Phasor representation, Real, reactive, apparent power, Resonance (series/parallel), 3-phase balanced circuits (star & delta)." },
                { title: "Unit 3: Transformers (09 Hours)", details: "Principle of operation & construction of single-phase transformers (core and shell type), Losses, Efficiency, Voltage regulation, B-H characteristics, Self/mutual inductance." },
                { title: "Unit 4: Electrical Machines (09 Hours)", details: "Rotating magnetic fields, Single-phase and three-phase induction motor working, Torque-slip characteristic, DC motors (types, characteristics, application, necessity of starter)." },
                { title: "Unit 5: Power Source (09 Hours)", details: "Wind, Solar, Fuel cell, Tidal, Geo-Thermal, Hydroelectric, Thermal, Nuclear power plants, Battery types and characteristics." }
            ],
            topics: [
                { title: "High Yield Exam Topics", details: "Thevenin & Norton Numericals, KVL/KCL Circuit Analysis, Transformer Efficiency & Losses, Star-Delta Conversion, Torque-Slip Characteristics." }
            ]
        },
        english: {
            syllabus: [
                { title: "Unit 1: Vocabulary Building (06 Hours)", details: "Word Formation, Foreign root words, Prefixes and suffixes, Synonyms, antonyms, Standard abbreviations." },
                { title: "Unit 2: Basic Writing Skills (06 Hours)", details: "Sentence Structures, Phrases and clauses, Punctuation, Paragraph coherence and organization, Precise writing." },
                { title: "Unit 3: Common Errors in Writing (06 Hours)", details: "Subject-verb agreement, Noun-pronoun agreement, Misplaced modifiers, Articles, Prepositions, Redundancies, Cliches." },
                { title: "Unit 4: Sensible Writing (06 Hours)", details: "Describing, Defining, Classifying, Providing evidence, Writing introduction and conclusion." },
                { title: "Unit 5: Communication Practices (06 Hours)", details: "Comprehension, Précis Writing, Essay Writing, Oral Communication (Pronunciation, Intonation, Workplace Dialogues, Presentations)." }
            ],
            topics: [
                { title: "High Yield Exam Topics", details: "Précis & Essay Writing, Subject-Verb Agreement Rules, Correcting Common Errors, Official Email & Letter Writing." }
            ]
        }
    };

    let appData = defaultData;
    let currentSubject = 'physics';
    let currentTab = 'syllabus';
    let isEditMode = false;
    let database = null;
    let dbRef = null;

    try {
        const app = initializeApp(firebaseConfig);
        database = getDatabase(app);
        dbRef = ref(database, 'syllabusData');

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appData = data;
                document.getElementById('sync-status').innerText = '🟢 Cloud Synced';
            } else {
                saveToFirebase();
            }
            renderContent();
        }, (error) => {
            console.warn("Firebase restricted, using local data", error);
            document.getElementById('sync-status').innerText = '🟡 Local Mode';
            renderContent();
        });
    } catch (e) {
        console.warn("Firebase Init Error:", e);
        renderContent();
    }

    function saveToFirebase() {
        if (dbRef) {
            document.getElementById('sync-status').innerText = '⏳ Saving...';
            set(dbRef, appData)
                .then(() => {
                    document.getElementById('sync-status').innerText = '🟢 Saved to Cloud';
                })
                .catch((err) => {
                    console.error("Save error:", err);
                    document.getElementById('sync-status').innerText = '🔴 Rule Error (Check Console)';
                });
        }
    }

    window.renderContent = function() {
        const container = document.getElementById('content-container');
        if (!appData || !appData[currentSubject]) return;

        const items = (appData[currentSubject] && appData[currentSubject][currentTab]) ? appData[currentSubject][currentTab] : [];
        let html = '';

        items.forEach((item, index) => {
            html += `
                <div class="unit-card">
                    <h4 contenteditable="${isEditMode}" class="${isEditMode ? 'editable-active' : ''}" onblur="window.updateData(${index}, 'title', this.innerText)">${item.title}</h4>
                    <p contenteditable="${isEditMode}" class="${isEditMode ? 'editable-active' : ''}" onblur="window.updateData(${index}, 'details', this.innerText)">${item.details}</p>
                    ${isEditMode ? `<button class="btn btn-danger" style="margin-top: 10px; padding: 4px 10px; font-size: 0.8rem;" onclick="window.deleteItem(${index})">🗑️ Delete Item</button>` : ''}
                </div>
            `;
        });

        if (items.length === 0) {
            html = '<p style="color: var(--text-muted);">No content available. Switch ON Edit Mode to add content.</p>';
        }

        container.innerHTML = html;
    };

    window.selectSubject = function(subject, element) {
        currentSubject = subject;
        document.querySelectorAll('.subject-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        renderContent();
    };

    window.switchTab = function(tab, element) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        renderContent();
    };

    window.toggleEditMode = function() {
        isEditMode = !isEditMode;
        const btn = document.getElementById('edit-toggle-btn');
        const adminControls = document.getElementById('admin-controls');

        if (isEditMode) {
            btn.innerText = '✏️ Edit Mode: ON';
            btn.classList.add('btn-active');
            adminControls.style.display = 'block';
        } else {
            btn.innerText = '✏️ Edit Mode: OFF';
            btn.classList.remove('btn-active');
            adminControls.style.display = 'none';
        }
        renderContent();
    };

    window.updateData = function(index, key, val) {
        if (appData && appData[currentSubject] && appData[currentSubject][currentTab][index]) {
            appData[currentSubject][currentTab][index][key] = val;
            saveToFirebase();
        }
    };

    window.addNewItem = function() {
        if (!appData[currentSubject]) appData[currentSubject] = {};
        if (!appData[currentSubject][currentTab]) appData[currentSubject][currentTab] = [];
        
        appData[currentSubject][currentTab].push({
            title: "New Unit / Topic Title (Click to Edit)",
            details: "Type syllabus content or topic details here..."
        });
        saveToFirebase();
        renderContent();
    };

    window.deleteItem = function(index) {
        if (confirm("Kya aap ise delete karna chahte hain?")) {
            appData[currentSubject][currentTab].splice(index, 1);
            saveToFirebase();
            renderContent();
        }
    };

    // First initial render
    renderContent();
</script>
</body>
</html>
