<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus Portal</title>
    <style>
        :root {
            --bg-dark: #0f0c1b;
            --card-bg: #1a162b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e2846;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .subject-card:hover, .subject-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
        }

        .subject-card h3 {
            font-size: 1rem;
        }

        .content-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
        }

        .unit-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .unit-card h4 {
            color: var(--accent);
            margin-bottom: 8px;
        }

        .unit-card p {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="portal-title">B.Tech CSE (AI) - Semester 1</h1>
        <p>Syllabus & Important Topics Portal</p>
    </header>

    <div class="controls-bar">
        <button class="btn" id="edit-toggle-btn" onclick="toggleEditMode()">✏️ Edit Mode: OFF</button>
        <button class="btn" onclick="exportData()">📤 Export Data (JSON)</button>
        <button class="btn" onclick="resetToDefault()">🔄 Reset to Default</button>
    </div>

    <div class="subject-grid">
        <div class="subject-card active" onclick="selectSubject('physics', this)">
            <h3>Applied Physics</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('maths', this)">
            <h3>Mathematics-I</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('english', this)">
            <h3>English</h3>
        </div>
        <div class="subject-card" onclick="selectSubject('electrical', this)">
            <h3>Basic Electrical</h3>
        </div>
    </div>

    <div class="content-panel">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('syllabus', this)">📚 Syllabus</button>
            <button class="tab-btn" onclick="switchTab('topics', this)">⭐ Important Topics</button>
        </div>

        <div id="content-container">
            <!-- Dynamic Content -->
        </div>

        <div class="admin-controls" id="admin-controls" style="display: none; margin-top: 15px;">
            <button class="btn btn-primary" onclick="addNewItem()">+ Add New Topic/Unit</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://syllabus-sessional-1-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const dbRef = ref(database, 'syllabusData');

    const defaultData = {
        physics: {
            syllabus: [
                { title: "Unit I: Mechanics (9 Hours)", details: "Newton's laws, Potential energy function, Conservation and non-conservation forces..." },
                { title: "Unit II: Electromagnetic Theory (9 Hours)", details: "Calculation of electric field, Gauss' law, Biot-Savart law..." }
            ],
            topics: [
                { title: "High Yield Exam Topics", details: "Schrödinger wave equation, Maxwell's equations derivation, Newton's rings experiment." }
            ]
        },
        maths: {
            syllabus: [
                { title: "Unit I: Calculus-I (10 Hours)", details: "Eigenvalues and eigenvectors, Cayley-Hamilton theorem, Lagrange multipliers..." }
            ],
            topics: [
                { title: "Important Exam Questions", details: "Cayley-Hamilton theorem, Taylor's & Maclaurin theorems, Fourier series expansions." }
            ]
        },
        english: {
            syllabus: [
                { title: "Unit I: Vocabulary Building", details: "The concept of Word Formation, Root words from foreign languages..." }
            ],
            topics: [
                { title: "Key Focus Areas", details: "Precis writing, Subject-verb agreement, Official correspondence." }
            ]
        },
        electrical: {
            syllabus: [
                { title: "Unit I: DC Circuits (8 Hours)", details: "Electrical circuit elements (R, L and C), voltage and current sources..." }
            ],
            topics: [
                { title: "Crucial Derivations & Numericals", details: "Thevenin's theorem numericals, KVL & KCL mesh analysis, Transformer efficiency." }
            ]
        }
    };

    let currentSubject = 'physics';
    let currentTab = 'syllabus';
    let isEditMode = false;
    let appData = null;

    function saveToFirebase() {
        if (appData) {
            set(dbRef, appData).catch(error => console.error("Firebase Sync Error: ", error));
        }
    }

    onValue(dbRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            appData = data;
        } else {
            appData = defaultData;
            saveToFirebase();
        }
        renderContent();
    });

    window.renderContent = function() {
        const container = document.getElementById('content-container');
        if (!appData || !appData[currentSubject]) return;

        const items = appData[currentSubject][currentTab] || [];
        let html = '';

        items.forEach((item, index) => {
            html += `
                <div class="unit-card">
                    <h4 contenteditable="${isEditMode}" onblur="updateData(${index}, 'title', this.innerText)">${item.title}</h4>
                    <p contenteditable="${isEditMode}" onblur="updateData(${index}, 'details', this.innerText)">${item.details}</p>
                    ${isEditMode ? `<button class="btn btn-danger" style="margin-top: 10px; padding: 4px 8px; font-size: 0.8rem;" onclick="deleteItem(${index})">🗑️ Delete</button>` : ''}
                </div>
            `;
        });

        if (items.length === 0) {
            html = '<p style="color: var(--text-muted);">No content available for this section.</p>';
        }

        container.innerHTML = html;
    };

    window.selectSubject = function(subject, element) {
        currentSubject = subject;
        document.querySelectorAll('.subject-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        renderContent();
    };

    window.switchTab = function(tab, element) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        renderContent();
    };

    window.toggleEditMode = function() {
        isEditMode = !isEditMode;
        const btn = document.getElementById('edit-toggle-btn');
        const adminControls = document.getElementById('admin-controls');

        if (isEditMode) {
            btn.innerText = '✏️ Edit Mode: ON';
            btn.style.color = 'var(--accent)';
            adminControls.style.display = 'block';
        } else {
            btn.innerText = '✏️ Edit Mode: OFF';
            btn.style.color = 'var(--text-main)';
            adminControls.style.display = 'none';
        }
        renderContent();
    };

    window.updateData = function(index, key, val) {
        if (appData && appData[currentSubject] && appData[currentSubject][currentTab][index]) {
            appData[currentSubject][currentTab][index][key] = val;
            saveToFirebase();
        }
    };

    window.addNewItem = function() {
        if (!appData[currentSubject][currentTab]) {
            appData[currentSubject][currentTab] = [];
        }
        appData[currentSubject][currentTab].push({
            title: "New Title (Click to Edit)",
            details: "Type details here..."
        });
        saveToFirebase();
        renderContent();
    };

    window.deleteItem = function(index) {
        if (confirm("Are you sure you want to delete this item?")) {
            appData[currentSubject][currentTab].splice(index, 1);
            saveToFirebase();
            renderContent();
        }
    };

    window.exportData = function() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "syllabus_data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    };

    window.resetToDefault = function() {
        if (confirm("Reset all data to default? This will overwrite your changes.")) {
            appData = JSON.parse(JSON.stringify(defaultData));
            saveToFirebase();
            renderContent();
        }
    };
</script>
</body>
</html>
